name: Build Soundprint Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soundprint-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure persistent debug keystore
        env:
          SOUNDPRINT_DEBUG_KEYSTORE_BASE64: ${{ secrets.SOUNDPRINT_DEBUG_KEYSTORE_BASE64 }}
          SOUNDPRINT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.SOUNDPRINT_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SOUNDPRINT_DEBUG_KEYSTORE_BASE64}" || -z "${SOUNDPRINT_DEBUG_KEYSTORE_PASSWORD}" ]]; then
            echo "Persistent debug keystore secrets are missing."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/soundprint-debug.keystore"
          printf '%s' "$SOUNDPRINT_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$SOUNDPRINT_DEBUG_KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / { print $2; exit }')"
          if [[ -z "$KEY_ALIAS" ]]; then
            echo "Could not identify a key alias in the supplied keystore."
            exit 1
          fi

          KEY_SHA1="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$SOUNDPRINT_DEBUG_KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA1: / { print toupper($2); exit }')"
          EXPECTED_SHA1="D0:19:A8:98:B3:4F:C9:45:84:4E:15:CB:D5:D0:6D:C4:A9:6F:DD:CB"
          if [[ "$KEY_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "Persistent keystore certificate SHA-1 does not match the expected certificate."
            echo "Expected: $EXPECTED_SHA1"
            echo "Actual:   $KEY_SHA1"
            exit 1
          fi
          echo "Persistent keystore certificate SHA-1 verified: $KEY_SHA1"

          {
            echo "SOUNDPRINT_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "SOUNDPRINT_DEBUG_KEYSTORE_PASSWORD=$SOUNDPRINT_DEBUG_KEYSTORE_PASSWORD"
            echo "SOUNDPRINT_DEBUG_KEY_ALIAS=$KEY_ALIAS"
            echo "SOUNDPRINT_DEBUG_KEY_PASSWORD=$SOUNDPRINT_DEBUG_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Report Android signing fingerprints
        run: ./gradlew --no-daemon signingReport

      - name: Run library database tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify debug APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Build Play release App Bundle
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: soundprint-play-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soundprint-plays-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK to Appetize
        id: appetize
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_PUBLIC_KEY }}
          appFile: app/build/outputs/apk/debug/app-debug.apk
          platform: android
          note: "Soundprint - ${{ github.sha }}"

      - name: Publish cloud preview link
        if: success()
        run: |
          echo "## Soundprint cloud preview" >> "$GITHUB_STEP_SUMMARY"
          echo " [Open Soundprint in Appetize](https://appetize.io/app/${{ steps.appetize.outputs.publicKey }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Appetize public key: ${{ steps.appetize.outputs.publicKey }}" >> "$GITHUB_STEP_SUMMARY"
